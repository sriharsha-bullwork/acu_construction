<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Waypoint Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>Waypoint Dashboard</h1>
      <div class="controls">
        <button id="missionStartBtn" title="Start mission over all waypoints">Start Mission</button>
        <button id="missionStopBtn" title="Stop mission and reset">Stop Mission</button>
        <button id="exportBtn" title="Export waypoints/routes">Export</button>
        <label for="importFile" class="button-like" title="Import waypoints/routes">Import</label>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
        <button id="pauseBtn" title="Pause current task">Pause</button>
        <button id="resumeBtn" title="Resume paused task">Resume</button>
        <button id="cancelBtn" title="Cancel current task">Cancel</button>
      </div>
    </header>

    <!-- Status at the top -->
    <section class="status-section">
      <div id="status" class="status">Status: idle</div>
      <div id="metrics" class="metrics"></div>
      <div id="gps" class="metrics"></div>
    </section>

    <!-- Two-column layout with waypoints on the side -->
    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>Waypoints</h2>
          <div id="wpList" class="list"></div>
        </section>
      </aside>

      <main class="content">
        <section>
          <h2>Routes</h2>
          <div id="routeList" class="list"></div>
        </section>
      </main>
    </div>

    <script>
      // Only enable Go buttons while mission mode is active
      let missionMode = false;
      function applyGoEnabled() {
        const enabled = !!missionMode;
        document.querySelectorAll('.go-btn').forEach(btn => {
          btn.disabled = !enabled;
          if (!enabled) btn.title = 'Start Mission to enable manual goals';
          else btn.title = 'Send goal to this waypoint';
        });
      }
      async function loadWaypoints() {
        const resp = await fetch('/api/waypoints');
        const data = await resp.json();
        const list = document.getElementById('wpList');
        list.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No waypoints loaded. Use Import to load a waypoints.json file.';
          list.appendChild(empty);
        }
        data.forEach(wp => {
          const row = document.createElement('div');
          row.className = 'row';
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = `${wp.name || wp.id}`;
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = `lat: ${Number(wp.lat).toFixed(6)}, lon: ${Number(wp.lon).toFixed(6)}, yaw: ${Number(wp.yaw_deg || 0).toFixed(1)}°`;
          const actions = document.createElement('div');
          actions.className = 'actions';
          const btn = document.createElement('button');
          btn.className = 'go-btn';
          btn.textContent = 'Go';
          btn.onclick = async () => {
            const r = await fetch(`/api/goal/${wp.id}`, { method: 'POST' });
            const j = await r.json();
            if (!j.ok) alert(j.error || 'Failed to send goal');
            await updateStatus();
          };
          // Disabled until mission mode is enabled
          btn.disabled = !missionMode;
          btn.title = missionMode ? 'Send goal to this waypoint' : 'Start Mission to enable manual goals';
          actions.appendChild(btn);
          row.appendChild(label);
          row.appendChild(meta);
          row.appendChild(actions);
          list.appendChild(row);
        });
        // Disable mission start if there are no waypoints
        const ms = document.getElementById('missionStartBtn');
        if (ms) ms.disabled = !(Array.isArray(data) && data.length > 0);
        applyGoEnabled();
      }

      async function loadRoutes() {
        const resp = await fetch('/api/routes');
        const data = await resp.json();
        const list = document.getElementById('routeList');
        list.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No routes available in JSON';
          list.appendChild(empty);
          return;
        }
        data.forEach(rt => {
          const row = document.createElement('div');
          row.className = 'row';
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = `${rt.id}`;
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = `waypoints: ${rt.size}`;
          const actions = document.createElement('div');
          actions.className = 'actions';
          const btn = document.createElement('button');
          btn.textContent = 'Start';
          btn.onclick = async () => {
            const r = await fetch(`/api/route/${rt.id}`, { method: 'POST' });
            const j = await r.json();
            if (!j.ok) alert(j.error || 'Failed to start route');
            await updateStatus();
          };
          actions.appendChild(btn);
          row.appendChild(label);
          row.appendChild(meta);
          row.appendChild(actions);
          list.appendChild(row);
        });
      }

      async function updateStatus() {
        const resp = await fetch('/api/status');
        const s = await resp.json();
        const el = document.getElementById('status');
        const metrics = document.getElementById('metrics');
        el.textContent = `Status: ${s.status}${s.mode ? ` | mode: ${s.mode}` : ''}${s.goal_id ? ` | goal: ${s.goal_id}` : ''}${s.route_id ? ` | route: ${s.route_id}` : ''}${s.error ? ` | error: ${s.error}` : ''}`;
        const dist = s.distance_remaining != null ? `${Number(s.distance_remaining).toFixed(2)} m` : '—';
        const eta = s.eta_sec != null ? `${Number(s.eta_sec).toFixed(1)} s` : '—';
        const prog = (s.route_current != null && s.route_total) ? `${s.route_current}/${s.route_total}` : '—';
        metrics.innerHTML = `
          <div><strong>Distance:</strong> ${dist}</div>
          <div><strong>ETA:</strong> ${eta}</div>
          <div><strong>Route Progress:</strong> ${prog}</div>
        `;

        // Enable/disable Go buttons based on mission mode
        const prev = missionMode;
        missionMode = (s.mode === 'mission');
        if (prev !== missionMode) applyGoEnabled();
      }

      document.getElementById('cancelBtn').onclick = async () => {
        const r = await fetch('/api/cancel', { method: 'POST' });
        const j = await r.json();
        if (!j.ok) alert(j.error || 'Failed to cancel');
        await updateStatus();
      };

      document.getElementById('pauseBtn').onclick = async () => {
        const r = await fetch('/api/pause', { method: 'POST' });
        const j = await r.json();
        if (!j.ok) alert(j.error || 'Failed to pause');
        await updateStatus();
      };

      document.getElementById('resumeBtn').onclick = async () => {
        const r = await fetch('/api/resume', { method: 'POST' });
        const j = await r.json();
        if (!j.ok) alert(j.error || 'Failed to resume');
        await updateStatus();
      };

      document.getElementById('missionStartBtn').onclick = async () => {
        const r = await fetch('/api/mission/start', { method: 'POST' });
        const j = await r.json();
        if (!j.ok) alert(j.error || 'Failed to start mission');
        await updateStatus();
      };

      document.getElementById('missionStopBtn').onclick = async () => {
        const r = await fetch('/api/mission/stop', { method: 'POST' });
        const j = await r.json();
        if (!j.ok) alert(j.error || 'Failed to stop mission');
        await updateStatus();
      };

      document.getElementById('exportBtn').onclick = async () => {
        try {
          const resp = await fetch('/api/export');
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'waypoints.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) {
          alert('Export failed');
        }
      };

      document.getElementById('importFile').addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const r = await fetch('/api/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const j = await r.json();
          if (!j.ok) {
            alert(j.error || 'Import failed');
          } else {
            await loadWaypoints();
            await loadRoutes();
          }
        } catch (err) {
          alert('Invalid JSON');
        } finally {
          e.target.value = '';
        }
      });

      setInterval(updateStatus, 1000);
      async function updateTelemetry() {
        try {
          const resp = await fetch('/api/telemetry');
          const t = await resp.json();
          const gps = t && t.gps ? t.gps : null;
          const el = document.getElementById('gps');
          if (!gps) {
            el.innerHTML = '<div><strong>GPS:</strong> —</div>';
            return;
          }
          const latStr = Number(gps.lat).toFixed(6);
          const lonStr = Number(gps.lon).toFixed(6);
          el.innerHTML = `
            <div><strong>Lat:</strong> ${latStr}</div>
            <div><strong>Lon:</strong> ${lonStr}</div>
          `;
        } catch (e) {
          // ignore transient errors
        }
      }
      setInterval(updateTelemetry, 1000);
      loadWaypoints();
      loadRoutes();
      updateStatus();
      applyGoEnabled();
      updateTelemetry();
    </script>
  </body>
  </html>
