<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Robot Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Robot Dashboard</h1>
        <div id="statusbar">
          <span id="statusBadge" class="badge idle">idle</span>
          <span id="pose" class="mono">pose: --</span>
        </div>
      </div>
      <div class="header-right">
        <div class="buttons">
          <button id="saveCurrentBtn" title="Add Waypoint at Current Pose">Save Current</button>
        </div>
        <div class="buttons">
          <button id="missionStartBtn" title="Enable mission mode">Start Mission</button>
          <button id="missionStopBtn" title="Stop mission and reset">Stop Mission</button>
        </div>
        <div class="buttons">
          <button id="pauseBtn" title="Pause current task">Pause</button>
          <button id="resumeBtn" title="Resume paused task">Resume</button>
          <button id="cancelBtn" title="Cancel current task">Cancel</button>
        </div>
        <div class="buttons">
          <button id="exportBtn" title="Export waypoints/routes">Export</button>
          <label for="importFile" class="button-like" title="Import waypoints/routes">Import</label>
          <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
        </div>
      </div>
    </header>

    <section class="status-section">
      <div id="status" class="status">Status: idle</div>
      <div id="metrics" class="metrics"></div>
      <div id="gps" class="metrics"></div>
    </section>

    <main>
      <section class="left">
        <div class="canvas-wrap">
          <div class="vehicle-panel">
            <canvas id="vehicleCanvas"></canvas>
          </div>
        </div>
      </section>
      <section class="right">
        <div id="edit-mode-panel">
          <h2>Waypoints</h2>
          <div id="wp-table-container"></div>
          <div class="buttons"><button id="btn-add-wp" title="Add Waypoint at Current Pose">Add Waypoint at Current Pose</button></div>

          <h2>Routes</h2>
          <div id="route-table-container"></div>
          <h3>Record Route</h3>
          <div class="settings-grid">
            <label for="route-from">From</label>
            <select id="route-from"></select>
            <label for="route-to">To</label>
            <select id="route-to"></select>
          </div>
          <div class="buttons">
            <button id="btn-start-recording">Start Recording</button>
            <button id="btn-finish-recording" disabled>Finish Recording</button>
            <button id="btn-save-route" disabled>Save Route</button>
          </div>
          <div id="recording-status" class="recording-status mono"></div>

          <h3>Recorded Routes</h3>
          <div id="gps-route-table-container"></div>
        </div>

        <div id="mission-mode-panel" class="hidden">
          <h2>On-Demand Navigation</h2>
          <div id="on-demand-buttons" class="buttons"></div>
        </div>

        <h2>Joystick</h2>
        <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>

        <h2>Video</h2>
        <div id="video-card" class="video-card">
          <div class="settings-grid">
            <label for="video-url">URL</label>
            <input type="url" id="video-url" placeholder="https://host:port/path/to/webrtc.html" />
          </div>
          <div class="buttons">
            <button id="btn-video-embed">Embed</button>
            <button id="btn-video-open">Open in New Tab</button>
          </div>
          <div class="video-frame-wrap">
            <iframe id="video-frame" title="WebRTC Feed" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms" src="about:blank"></iframe>
          </div>
          <div id="video-note" class="video-note mono"></div>
        </div>
      </section>
    </main>

    <script>
      // Only enable Go buttons while mission mode is active
      let missionMode = false;
      function applyGoEnabled() {
        // Enable Save Current only when NOT in mission mode
        const saveBtn = document.getElementById('saveCurrentBtn');
        if (saveBtn) saveBtn.disabled = !!missionMode;
      }

      // Simple vehicle view state
      let odomOrigin = null; // {x, y}
      let odomScale = 5; // px per meter
      let localWps = []; // [{id,name,x,y,yaw_deg}]
      let lastOdom = null;
      let lastPlan = null; // {points:[{x,y}], frame}

      function resizeCanvasForDPR(canvas, ctx) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const displayWidth = Math.max(1, Math.round(rect.width));
        const displayHeight = Math.max(1, Math.round(rect.height));
        if (canvas.width !== displayWidth * dpr || canvas.height !== displayHeight * dpr) {
          canvas.width = displayWidth * dpr;
          canvas.height = displayHeight * dpr;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { W: displayWidth, H: displayHeight };
      }

      function ensureOrigin() {
        if (odomOrigin) return;
        if (lastOdom && typeof lastOdom.x === 'number') {
          odomOrigin = { x: lastOdom.x, y: lastOdom.y };
          return;
        }
        if (Array.isArray(localWps) && localWps.length > 0) {
          let sx = 0, sy = 0, n = 0;
          localWps.forEach(w => { const x = Number(w.x), y = Number(w.y); if (isFinite(x) && isFinite(y)) { sx += x; sy += y; n++; } });
          if (n > 0) { odomOrigin = { x: sx / n, y: sy / n }; return; }
        }
        odomOrigin = { x: 0, y: 0 };
      }

  function redrawCanvas() {
        const canvas = document.getElementById('vehicleCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { W, H } = resizeCanvasForDPR(canvas, ctx);
        const cx = W / 2, cy = H / 2;
        ensureOrigin();

        const worldToScreen = (pt) => ({
          x: cx + (pt.x - odomOrigin.x) * odomScale,
          y: cy - (pt.y - odomOrigin.y) * odomScale,
        });
        const screenToWorld = (p) => ({
          x: (p.x - cx) / odomScale + odomOrigin.x,
          y: -(p.y - cy) / odomScale + odomOrigin.y,
        });

        // Clear
        ctx.clearRect(0, 0, W, H);

        // Axes
        ctx.strokeStyle = '#d1d5db';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, cy); ctx.lineTo(W, cy);
        ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
        ctx.stroke();

        // Waypoints and labels
        if (Array.isArray(localWps) && localWps.length > 0) {
          ctx.fillStyle = '#059669';
          ctx.strokeStyle = '#065f46';
          ctx.lineWidth = 1.5;
          ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
          ctx.textBaseline = 'bottom';
          localWps.forEach(wp => {
            const p = worldToScreen({ x: Number(wp.x), y: Number(wp.y) });
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
          ctx.fillStyle = '#111827';
          localWps.forEach(wp => {
            const p = worldToScreen({ x: Number(wp.x), y: Number(wp.y) });
            const label = (wp.name || wp.id || '').toString();
            if (label) ctx.fillText(label, p.x + 8, p.y - 6);
          });
        }

        // Global plan polyline
        if (lastPlan && Array.isArray(lastPlan.points) && lastPlan.points.length > 1) {
          ctx.strokeStyle = '#7c3aed';
          ctx.lineWidth = 2;
          ctx.beginPath();
          const p0 = worldToScreen(lastPlan.points[0]);
          ctx.moveTo(p0.x, p0.y);
          for (let i = 1; i < lastPlan.points.length; i++) {
            const p = worldToScreen(lastPlan.points[i]);
            ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }

        // Draw all saved GPS routes (thin green)
        if (Array.isArray(window._allRoutesLocal)) {
          ctx.strokeStyle = '#86efac';
          ctx.lineWidth = 1.5;
          window._allRoutesLocal.forEach(route => {
            if (!route || !Array.isArray(route.points) || route.points.length < 2) return;
            ctx.beginPath();
            const p0 = worldToScreen(route.points[0]);
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < route.points.length; i++) {
              const p = worldToScreen(route.points[i]);
              ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
          });
        }

        // Preview GPS route (highlighted green)
        if (window._previewLocal && window._previewLocal.length > 1) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          const p0 = worldToScreen(window._previewLocal[0]);
          ctx.moveTo(p0.x, p0.y);
          for (let i = 1; i < window._previewLocal.length; i++) {
            const p = worldToScreen(window._previewLocal[i]);
            ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }

        // Vehicle marker
        if (lastOdom && typeof lastOdom.x === 'number') {
          const pos = worldToScreen({ x: lastOdom.x, y: lastOdom.y });
          const yawRad = (Number(lastOdom.yaw_deg) || 0) * Math.PI / 180;
          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(-yawRad);
          ctx.fillStyle = '#2563eb';
          ctx.beginPath();
          ctx.moveTo(12, 0);
          ctx.lineTo(-10, 7);
          ctx.lineTo(-10, -7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        // Bind interactions once (pan + zoom)
        if (!canvas._handlersBound) {
          let dragging = false;
          let last = { x: 0, y: 0 };
          canvas.addEventListener('mousedown', (e) => {
            dragging = true;
            last = { x: e.offsetX, y: e.offsetY };
          });
          window.addEventListener('mouseup', () => { dragging = false; });
          canvas.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const dx = e.offsetX - last.x;
            const dy = e.offsetY - last.y;
            last = { x: e.offsetX, y: e.offsetY };
            odomOrigin = {
              x: odomOrigin.x - dx / odomScale,
              y: odomOrigin.y + dy / odomScale,
            };
            redrawCanvas();
          });
          canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            const cx = rect.width / 2, cy = rect.height / 2;
            const world = {
              x: (mouse.x - cx) / odomScale + odomOrigin.x,
              y: -(mouse.y - cy) / odomScale + odomOrigin.y,
            };
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(200, Math.max(0.5, odomScale * zoomFactor));
            odomOrigin = {
              x: world.x - (mouse.x - cx) / newScale,
              y: world.y + (mouse.y - cy) / newScale,
            };
            odomScale = newScale;
            redrawCanvas();
          }, { passive: false });
          canvas._handlersBound = true;
        }
      }

      function drawVehicle(odom) {
        if (!odom) return;
        if (!odomOrigin) odomOrigin = { x: odom.x, y: odom.y };
        redrawCanvas();
      }

      async function loadWaypointsLocal() {
        try {
          const resp = await fetch('/api/waypoints_local');
          localWps = await resp.json();
        } catch (e) {
          localWps = [];
        }
      }
  async function loadWaypoints() {
        const resp = await fetch('/api/waypoints');
        const data = await resp.json();
        const container = document.getElementById('wp-table-container');
        container.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) {
          const empty = document.createElement('div'); empty.className='empty';
          empty.textContent = 'No waypoints loaded. Use Import to load a waypoints.json file.'; container.appendChild(empty);
        } else {
          const table = document.createElement('table');
          table.innerHTML = '<thead><tr><th>Name</th><th>Actions</th></tr></thead>';
          const tbody = document.createElement('tbody');
          data.forEach(wp => {
            const tr = document.createElement('tr');
            const tdName = document.createElement('td'); tdName.textContent = `${wp.name || wp.id}`;
            const tdAct = document.createElement('td'); const actions = document.createElement('div'); actions.className='buttons';
            const rn = document.createElement('button'); rn.textContent='Rename'; rn.onclick = async () => { const newName = prompt('New name for waypoint', wp.name || wp.id); if (!newName) return; const r = await fetch(`/api/waypoints/rename/${wp.id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:newName})}); const j = await r.json(); if (!j.ok) alert(j.error||'Rename failed'); await loadWaypoints(); await loadWaypointsLocal(); redrawCanvas(); };
            const del = document.createElement('button'); del.className='btn-delete'; del.textContent='✕'; del.title='Delete'; del.onclick = async () => { if (!confirm(`Delete waypoint ${wp.name || wp.id}?`)) return; const r = await fetch(`/api/waypoints/${wp.id}`, {method:'DELETE'}); const j = await r.json(); if (!j.ok) alert(j.error||'Delete failed'); await loadWaypoints(); await loadWaypointsLocal(); redrawCanvas(); };
            actions.appendChild(rn); actions.appendChild(del); tdAct.appendChild(actions);
            tr.appendChild(tdName); tr.appendChild(tdAct); tbody.appendChild(tr);
          });
          table.appendChild(tbody); container.appendChild(table);
        }
        // Populate selects for recording
        const selFrom = document.getElementById('route-from');
        const selTo = document.getElementById('route-to');
        if (selFrom && selTo) {
          selFrom.innerHTML = ''; selTo.innerHTML = '';
          (Array.isArray(data) ? data : []).forEach(w => {
            const o1 = document.createElement('option'); o1.value = w.id; o1.textContent = w.name || w.id; selFrom.appendChild(o1);
            const o2 = document.createElement('option'); o2.value = w.id; o2.textContent = w.name || w.id; selTo.appendChild(o2);
          });
        }
        const ms = document.getElementById('missionStartBtn'); if (ms) ms.disabled = !(Array.isArray(data) && data.length > 0);
        applyGoEnabled();
      }

      async function loadRoutes() {
        const resp = await fetch('/api/routes');
        const data = await resp.json();
        const container = document.getElementById('route-table-container'); container.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) { const empty = document.createElement('div'); empty.className='empty'; empty.textContent='No routes available in JSON'; container.appendChild(empty); return; }
        const table = document.createElement('table'); table.innerHTML = '<thead><tr><th>Route</th><th>Info</th></tr></thead>';
        const tbody = document.createElement('tbody');
        data.forEach(rt => {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td'); tdName.textContent = rt.id;
          const tdMeta = document.createElement('td'); tdMeta.className='mono'; tdMeta.textContent = `waypoints: ${rt.size}`;
          tr.appendChild(tdName); tr.appendChild(tdMeta); tbody.appendChild(tr);
        });
        table.appendChild(tbody); container.appendChild(table);
      }

  async function loadGpsRoutes() {
        try {
          const resp = await fetch('/api/gps_routes');
          const data = await resp.json();
          const container = document.getElementById('gps-route-table-container'); container.innerHTML = '';
          if (!Array.isArray(data) || data.length === 0) { const empty = document.createElement('div'); empty.className='empty'; empty.textContent='No recorded GPS routes'; container.appendChild(empty); window._previewLocal = []; redrawCanvas(); return; }
          const table = document.createElement('table'); table.innerHTML = '<thead><tr><th>From</th><th>To</th><th>Points</th><th>Actions</th></tr></thead>';
          const tbody = document.createElement('tbody');
          data.forEach(rt => {
            const tr = document.createElement('tr');
            const tdF = document.createElement('td'); tdF.textContent = rt.from;
            const tdT = document.createElement('td'); tdT.textContent = rt.to;
            const tdS = document.createElement('td'); tdS.textContent = String(rt.size || 0);
            const tdA = document.createElement('td'); const actions = document.createElement('div'); actions.className='buttons';
            const del = document.createElement('button'); del.className='btn-delete'; del.textContent='✕'; del.title='Delete';
            del.onclick = async () => { if (!confirm(`Delete route ${rt.from} -> ${rt.to} (and reverse)?`)) return; const r = await fetch('/api/gps_routes/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({from_id: rt.from, to_id: rt.to})}); const j = await r.json(); if (!j.ok) alert(j.error||'Delete failed'); await loadGpsRoutes(); };
            const sp = document.createElement('button'); sp.textContent='Smooth (Preview)'; sp.onclick = async () => { const r = await fetch('/api/gps_routes/smooth_preview', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({from_id: rt.from, to_id: rt.to})}); const j = await r.json(); if (!j.ok) { alert(j.error||'Smooth preview failed'); return; } window._previewLocal = j.points || []; redrawCanvas(); };
            const sa = document.createElement('button'); sa.textContent='Apply Smoothed'; sa.onclick = async () => { const r = await fetch('/api/gps_routes/smooth_apply', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({from_id: rt.from, to_id: rt.to})}); const j = await r.json(); if (!j.ok) { alert(j.error||'Smooth apply failed'); return; } await loadGpsRoutes(); };
            actions.appendChild(del); actions.appendChild(sp); actions.appendChild(sa); tdA.appendChild(actions);
            tr.appendChild(tdF); tr.appendChild(tdT); tr.appendChild(tdS); tr.appendChild(tdA); tbody.appendChild(tr);
          });
          table.appendChild(tbody); container.appendChild(table);

          // If no preview yet, preview first route
          try {
            // Fetch all routes (local) for drawing
            const all = await fetch('/api/gps_routes/local_all');
            const aj = await all.json();
            if (aj && aj.ok && Array.isArray(aj.routes)) {
              window._allRoutesLocal = aj.routes;
            } else {
              window._allRoutesLocal = [];
            }
            // Pick first as preview and sync selects
            const selFrom = document.getElementById('route-from'); const selTo = document.getElementById('route-to');
            if (data.length) {
              const first = data[0];
              if (selFrom) selFrom.value = first.from;
              if (selTo) selTo.value = first.to;
              const r = await fetch(`/api/gps_routes/local?from_id=${encodeURIComponent(first.from)}&to_id=${encodeURIComponent(first.to)}`);
              const j = await r.json(); if (j && j.ok && Array.isArray(j.points)) { window._previewLocal = j.points; }
            } else {
              window._previewLocal = [];
            }
            redrawCanvas();
          } catch {}
        } catch {}
      }

      async function updateStatus() {
        const resp = await fetch('/api/status');
        const s = await resp.json();
        const el = document.getElementById('status');
        const metrics = document.getElementById('metrics');
        // Nearby waypoint detection (client-side) using odom + local waypoints
        let nearText = '';
        let turnAlertText = '';
        try {
          if (lastOdom && Array.isArray(localWps) && localWps.length) {
            let found = null;
            for (const wp of localWps) {
              const dx = Number(wp.x) - Number(lastOdom.x);
              const dy = Number(wp.y) - Number(lastOdom.y);
              const d = Math.hypot(dx, dy);
              const tol = Number(wp.tol_m != null ? wp.tol_m : 1.5);
              if (d <= tol) { found = { id: wp.id, name: wp.name || wp.id, dist: d, tol, x: Number(wp.x), y: Number(wp.y), yaw_deg: Number(wp.yaw_deg || 0) }; break; }
            }
            if (found) nearText = ` | near: ${found.name}`;
            // If near a waypoint and plan exists, check departure angle against waypoint yaw
            if (found && lastPlan && Array.isArray(lastPlan.points) && lastPlan.points.length > 1) {
              let bestIdx = 0; let bestD = Infinity;
              for (let i = 0; i < lastPlan.points.length; i++) {
                const p = lastPlan.points[i];
                const dd = Math.hypot(Number(p.x) - found.x, Number(p.y) - found.y);
                if (dd < bestD) { bestD = dd; bestIdx = i; }
              }
              const i1 = Math.min(bestIdx + 1, lastPlan.points.length - 1);
              const p0 = lastPlan.points[bestIdx]; const p1 = lastPlan.points[i1];
              const depRad = Math.atan2(Number(p1.y) - Number(p0.y), Number(p1.x) - Number(p0.x));
              const depDeg = (depRad * 180 / Math.PI + 360) % 360;
              let diff = Math.abs(depDeg - found.yaw_deg) % 360; if (diff > 180) diff = 360 - diff;
              if (diff > 120) turnAlertText = ` | ALERT: sharp departure at ${found.name} (${diff.toFixed(0)}°)`;
            }
          }
        } catch {}
        el.textContent = `Status: ${s.status}${s.mode ? ` | mode: ${s.mode}` : ''}${s.goal_id ? ` | goal: ${s.goal_id}` : ''}${s.route_id ? ` | route: ${s.route_id}` : ''}${nearText}${turnAlertText}${s.error ? ` | error: ${s.error}` : ''}`;
        const dist = s.distance_remaining != null ? `${Number(s.distance_remaining).toFixed(2)} m` : '—';
        const eta = s.eta_sec != null ? `${Number(s.eta_sec).toFixed(1)} s` : '—';
        const prog = (s.route_current != null && s.route_total) ? `${s.route_current}/${s.route_total}` : '—';
        metrics.innerHTML = `
          <div><strong>Distance:</strong> ${dist}</div>
          <div><strong>ETA:</strong> ${eta}</div>
          <div><strong>Route Progress:</strong> ${prog}</div>
        `;
        const prev = missionMode;
        missionMode = (s.mode === 'mission');
        // Toggle button states
        const startBtn = document.getElementById('missionStartBtn');
        const stopBtn = document.getElementById('missionStopBtn');
        if (startBtn) startBtn.disabled = !!missionMode;
        if (stopBtn) stopBtn.disabled = !missionMode;
        // Pause/Resume/Cancel availability
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        if (s.status === 'active') {
          if (pauseBtn) pauseBtn.disabled = false;
          if (resumeBtn) resumeBtn.disabled = true;
          if (cancelBtn) cancelBtn.disabled = false;
        } else if (s.status === 'paused') {
          if (pauseBtn) pauseBtn.disabled = true;
          if (resumeBtn) resumeBtn.disabled = false;
          if (cancelBtn) cancelBtn.disabled = false;
        } else {
          if (pauseBtn) pauseBtn.disabled = true;
          if (resumeBtn) resumeBtn.disabled = true;
          if (cancelBtn) cancelBtn.disabled = true;
        }

        if (prev !== missionMode) {
          applyGoEnabled();
          // Toggle panels
          const edit = document.getElementById('edit-mode-panel');
          const mission = document.getElementById('mission-mode-panel');
          if (missionMode) {
            if (edit) edit.classList.add('hidden');
            if (mission) mission.classList.remove('hidden');
            await renderOnDemandButtons();
          } else {
            if (mission) mission.classList.add('hidden');
            if (edit) edit.classList.remove('hidden');
            // Clear on-demand
            const odb = document.getElementById('on-demand-buttons'); if (odb) odb.innerHTML = '';
          }
        }
        // Highlight active on-demand goal
        updateOnDemandHighlight(s);
      }

      async function renderOnDemandButtons() {
        try {
          const resp = await fetch('/api/waypoints');
          const data = await resp.json();
          const odb = document.getElementById('on-demand-buttons'); if (!odb) return;
          odb.innerHTML = '';
          if (!Array.isArray(data) || data.length === 0) {
            const empty = document.createElement('div'); empty.className='empty'; empty.textContent='No waypoints loaded'; odb.appendChild(empty); return;
          }
          data.forEach(wp => {
            const b = document.createElement('button'); b.textContent = wp.name || wp.id; b.dataset.wpId = wp.id;
            b.onclick = async () => { const r = await fetch(`/api/mission/goal/${wp.id}`, {method:'POST'}); const j = await r.json(); if (!j.ok) alert(j.error||'Failed to send goal'); await updateStatus(); };
            odb.appendChild(b);
          });
        } catch {}
      }

      function updateOnDemandHighlight(s) {
        const odb = document.getElementById('on-demand-buttons'); if (!odb) return;
        const buttons = odb.querySelectorAll('button');
        buttons.forEach(btn => {
          if (s && s.goal_id && btn.dataset.wpId === String(s.goal_id) && s.status === 'active') {
            btn.classList.add('in-progress');
          } else {
            btn.classList.remove('in-progress');
          }
        });
      }

      document.getElementById('cancelBtn').onclick = async () => {

      document.getElementById('pauseBtn').onclick = async () => {

      document.getElementById('resumeBtn').onclick = async () => {

      document.getElementById('missionStartBtn').onclick = async () => {

      document.getElementById('exportBtn').onclick = async () => {

      document.getElementById('saveCurrentBtn').onclick = async () => {
        const name = prompt('Name for new waypoint (optional)', '');
        const r = await fetch('/api/waypoints/add_current', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: name || undefined })
        });
        const j = await r.json();
        if (!j.ok) { alert(j.error || 'Failed to save waypoint'); return; }
        await loadWaypoints();
        await loadWaypointsLocal();

      };

      document.getElementById('importFile').addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const r = await fetch('/api/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const j = await r.json();
          if (!j.ok) {
            alert(j.error || 'Import failed');
          } else {
            await loadWaypoints();
            await loadRoutes();
            await loadGpsRoutes();
            await loadWaypointsLocal();

          }
        } catch (err) {
          alert('Invalid JSON');
        } finally {
          e.target.value = '';
        }
      });
      // Mirror header control
      const btnAddWp = document.getElementById('btn-add-wp'); if (btnAddWp) btnAddWp.onclick = () => document.getElementById('saveCurrentBtn').click();

      // Clear all button
      (function initClearAll(){
        const headerRight = document.querySelector('.header-right .buttons:last-child');
        if (!headerRight) return;
        const clr = document.createElement('button'); clr.textContent = 'Clear All'; clr.title = 'Clear all waypoints and routes';
        clr.onclick = async () => { if (!confirm('Clear all waypoints and routes?')) return; const r = await fetch('/api/clear_all', {method:'POST'}); const j = await r.json(); if (!j.ok) { alert(j.error||'Failed to clear'); return; } window._previewLocal = []; await loadWaypoints(); await loadRoutes(); await loadGpsRoutes(); await loadWaypointsLocal(); redrawCanvas(); };
        headerRight.appendChild(clr);
      })();

      // Video card logic
      (function initVideoCard(){
        const urlInput = document.getElementById('video-url');
        const btnEmbed = document.getElementById('btn-video-embed');
        const btnOpen = document.getElementById('btn-video-open');
        const frame = document.getElementById('video-frame');
        const note = document.getElementById('video-note');
        if (!urlInput || !btnEmbed || !btnOpen || !frame) return;

        // Restore remembered URL
        try { const saved = localStorage.getItem('video_url'); if (saved) urlInput.value = saved; } catch {}

        const setFrame = (u) => {
          if (!u) return;
          frame.src = u;
          try { localStorage.setItem('video_url', u); } catch {}
          // Show tip for X-Frame-Options issues
          setTimeout(() => { if (note) note.textContent = ''; }, 100);
        };

        btnEmbed.onclick = () => {
          const u = urlInput.value.trim();
          if (!u) { alert('Enter a valid URL'); return; }
          setFrame(u);
          // If target blocks embedding (X-Frame-Options), show a helpful note
          setTimeout(() => {
            try {
              // Accessing frame.contentDocument may fail on cross-origin; rely on user feedback
              if (note) note.textContent = 'If the page fails to load here, it may disallow embedding. Use "Open in New Tab".';
            } catch {}
          }, 300);
        };

        btnOpen.onclick = () => {
          const u = urlInput.value.trim();
          if (!u) { alert('Enter a valid URL'); return; }
          try { window.open(u, '_blank', 'noopener'); } catch {}
        };

        // Auto-embed on load if URL present
        if (urlInput.value) setFrame(urlInput.value);
      })();

      setInterval(updateStatus, 1000);
      async function updateTelemetry() {
        try {
          const resp = await fetch('/api/telemetry');
          const t = await resp.json();
          const gps = t && t.gps ? t.gps : null;
          const el = document.getElementById('gps');
          if (!gps) {
            const heading = (t && typeof t.heading_deg === 'number') ? `${Number(t.heading_deg).toFixed(1)}°` : '—';
            el.innerHTML = `<div><strong>GPS:</strong> —</div><div><strong>Heading:</strong> ${heading}</div>`;
          } else {
            const latStr = Number(gps.lat).toFixed(6);
            const lonStr = Number(gps.lon).toFixed(6);
            const heading = (t && typeof t.heading_deg === 'number') ? `${Number(t.heading_deg).toFixed(1)}°` : '—';
            el.innerHTML = `
              <div><strong>Lat:</strong> ${latStr}</div>
              <div><strong>Lon:</strong> ${lonStr}</div>
              <div><strong>Heading:</strong> ${heading}</div>
            `;
          }

          // Draw vehicle from odometry if available
          if (t && t.odom && typeof t.odom.x === 'number' && typeof t.odom.y === 'number') {
            lastOdom = t.odom;
            drawVehicle(t.odom);
          } else if (lastOdom) {
            drawVehicle(lastOdom);
          }
          if (t && t.plan && Array.isArray(t.plan.points)) {
            lastPlan = t.plan;
            redrawCanvas();
          }
          // Route recording (frontend sampling + preview)
          if (window._recActive && t && t.gps && typeof t.heading_deg === 'number') {
            const pt = { lat: Number(t.gps.lat), lon: Number(t.gps.lon), yaw_deg: Number(t.heading_deg) };
            const arr = window._recPoints || (window._recPoints = []);
            const last = arr.length ? arr[arr.length - 1] : null;
            const distM = (a,b) => {
              const R=6371000.0, toRad=Math.PI/180; const dlat=(b.lat-a.lat)*toRad, dlon=(b.lon-a.lon)*toRad; const la1=a.lat*toRad, la2=b.lat*toRad; const s = Math.sin(dlat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlon/2)**2; return 2*R*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
            };
            const density = window._recDensityM || 0.5;
            if (!last || distM({lat:last.lat,lon:last.lon},{lat:pt.lat,lon:pt.lon}) >= density) {
              // Add straight-line breakdown between last and pt if gap large
              if (last) {
                const step = 3.0;
                const d = distM(last, pt);
                if (d > step) {
                  const n = Math.floor(d / step);
                  for (let i = 1; i <= n; i++) {
                    const tfrac = i / (n + 1);
                    arr.push({ lat: last.lat + (pt.lat - last.lat) * tfrac, lon: last.lon + (pt.lon - last.lon) * tfrac, yaw_deg: pt.yaw_deg });
                  }
                }
              }
              arr.push(pt);
              const rs = document.getElementById('recording-status'); if (rs) rs.textContent = `Recording: ${arr.length} points`;
              // Preview conversion to local for canvas drawing, including straight-line connections to waypoints
              try {
                let arrExt = arr.slice();
                const selFrom = document.getElementById('route-from'); const selTo = document.getElementById('route-to');
                const map = window._wpById || {};
                const fromWp = map && selFrom ? map[selFrom.value] : null;
                const toWp = map && selTo ? map[selTo.value] : null;
                const step = 3.0;
                if (fromWp && arrExt.length) {
                  const a = {lat:Number(fromWp.lat), lon:Number(fromWp.lon)}; const b = {lat:arrExt[0].lat, lon:arrExt[0].lon};
                  const d = distM(a,b);
                  if (d > 2.0) {
                    const n = Math.floor(d / step);
                    const seg = [a]; for (let i=1;i<=n;i++){const tf=i/(n+1); seg.push({lat:a.lat+(b.lat-a.lat)*tf, lon:a.lon+(b.lon-a.lon)*tf});}
                    arrExt = seg.concat(arrExt);
                  }
                }
                if (toWp && arrExt.length) {
                  const a = {lat:arrExt[arrExt.length-1].lat, lon:arrExt[arrExt.length-1].lon}; const b = {lat:Number(toWp.lat), lon:Number(toWp.lon)};
                  const d = distM(a,b);
                  if (d > 2.0) {
                    const n = Math.floor(d / step);
                    const seg = []; for (let i=1;i<=n;i++){const tf=i/(n+1); seg.push({lat:a.lat+(b.lat-a.lat)*tf, lon:a.lon+(b.lon-a.lon)*tf});}
                    seg.push(b); arrExt = arrExt.concat(seg);
                  }
                }
                const pr = await fetch('/api/gps_routes/preview_local', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: arrExt }) });
                const pj = await pr.json(); if (pj && pj.ok && Array.isArray(pj.points)) { window._previewLocal = pj.points; redrawCanvas(); }
              } catch {}
            }
          }
        } catch (e) {
          // ignore transient errors
        }
      }
      setInterval(updateTelemetry, 1000);
      loadWaypoints();
      loadRoutes();
      loadGpsRoutes();
      loadWaypointsLocal();
      updateStatus();
      applyGoEnabled();
      updateTelemetry();
      window.addEventListener('resize', () => {
        if (lastOdom) drawVehicle(lastOdom);
      });

      // Joystick logic
      (function initJoystick(){
        const joy = document.getElementById('joystick');
        const stick = document.getElementById('stick');
        if (!joy || !stick) return;

        let active = false;
        let vec = { x: 0, y: 0 };
        let sendTimer = null;
        const dead = 0.08; // deadzone (normalized)

        function setStick(x, y) { // x,y in px relative to center
          stick.style.transform = `translate(${x}px, ${y}px)`;
        }

        function startSendLoop() {
          if (sendTimer) return;
          sendTimer = setInterval(async () => {
            const mag = Math.hypot(vec.x, vec.y);
            if (!active || mag < dead) return; // do not publish when centered
            const lx = -vec.y; // up -> +linear.x
            const az = -vec.x; // right -> -angular.z
            try {
              await fetch('/api/cmd_vel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lx, az }),
              });
            } catch (e) {}
          }, 100); // ~10 Hz
        }

        function stopSendLoop() {
          if (sendTimer) clearInterval(sendTimer);
          sendTimer = null;
        }

        function updateFromPointer(clientX, clientY) {
          const r = joy.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          let dx = clientX - cx;
          let dy = clientY - cy;
          const radius = Math.min(r.width, r.height) / 2 - 16; // margin for stick
          const dist = Math.hypot(dx, dy);
          if (dist > radius) { const s = radius / dist; dx *= s; dy *= s; }
          setStick(dx, dy);
          // normalize to [-1,1]
          vec.x = dx / radius;
          vec.y = dy / radius;
        }

        function resetStick() {
          vec.x = 0; vec.y = 0;
          setStick(0, 0);
        }

        joy.addEventListener('pointerdown', (e) => {
          active = true;
          joy.setPointerCapture(e.pointerId);
          updateFromPointer(e.clientX, e.clientY);
          startSendLoop();
        });
        joy.addEventListener('pointermove', (e) => {
          if (!active) return;
          updateFromPointer(e.clientX, e.clientY);
        });
        function endPointer(e){
          active = false;
          try { joy.releasePointerCapture(e.pointerId); } catch {}
          resetStick();
          // do NOT publish when centered per requirement
          stopSendLoop();
        }
        joy.addEventListener('pointerup', endPointer);
        joy.addEventListener('pointercancel', endPointer);
        joy.addEventListener('pointerleave', endPointer);
      })();

      // Recording controls
      (function initRecording(){
        const btnStart = document.getElementById('btn-start-recording');
        const btnFinish = document.getElementById('btn-finish-recording');
        const btnSave = document.getElementById('btn-save-route');
        const selFrom = document.getElementById('route-from');
        const selTo = document.getElementById('route-to');
        if (!btnStart || !btnFinish || !btnSave || !selFrom || !selTo) return;
        window._recActive = false; window._recPoints = []; window._recDensityM = 0.5; const tolM = 2.0;

        btnStart.onclick = () => {
          window._recPoints = []; window._recActive = true; btnStart.disabled = true; btnFinish.disabled = false; btnSave.disabled = true; const rs = document.getElementById('recording-status'); if (rs) rs.textContent = 'Recording: 0 points';
        };
        btnFinish.onclick = async () => {
          window._recActive = false; btnFinish.disabled = true; btnSave.disabled = false; btnStart.disabled = false; const rs = document.getElementById('recording-status'); if (rs) rs.textContent = `Recorded: ${(window._recPoints||[]).length} points`;
          // Keep preview as the final recorded path
          try {
            const arr = window._recPoints || [];
            // Extend with straight-line segments to/from selected waypoints for preview
            const map = window._wpById || {}; const selFrom = document.getElementById('route-from'); const selTo = document.getElementById('route-to');
            const fromWp = map && selFrom ? map[selFrom.value] : null; const toWp = map && selTo ? map[selTo.value] : null;
            const distM = (a,b) => { const R=6371000.0, t=Math.PI/180; const dlat=(b.lat-a.lat)*t, dlon=(b.lon-a.lon)*t; const la1=a.lat*t, la2=b.lat*t; const s=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlon/2)**2; return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); };
            const step=3.0; let arrExt=arr.slice();
            if (fromWp && arrExt.length){ const a={lat:Number(fromWp.lat),lon:Number(fromWp.lon)}; const b={lat:arrExt[0].lat,lon:arrExt[0].lon}; const d=distM(a,b); if (d>2.0){ const n=Math.floor(d/step); const seg=[a]; for(let i=1;i<=n;i++){const tf=i/(n+1); seg.push({lat:a.lat+(b.lat-a.lat)*tf, lon:a.lon+(b.lon-a.lon)*tf});} arrExt=seg.concat(arrExt);} }
            if (toWp && arrExt.length){ const a={lat:arrExt[arrExt.length-1].lat,lon:arrExt[arrExt.length-1].lon}; const b={lat:Number(toWp.lat),lon:Number(toWp.lon)}; const d=distM(a,b); if (d>2.0){ const n=Math.floor(d/step); const seg=[]; for(let i=1;i<=n;i++){const tf=i/(n+1); seg.push({lat:a.lat+(b.lat-a.lat)*tf, lon:a.lon+(b.lon-a.lon)*tf});} seg.push(b); arrExt=arrExt.concat(seg);} }
            const pr = await fetch('/api/gps_routes/preview_local', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: arrExt }) });
            const pj = await pr.json(); if (pj && pj.ok && Array.isArray(pj.points)) { window._previewLocal = pj.points; redrawCanvas(); }
          } catch {}
        };
        btnSave.onclick = async () => {
          const from_id = selFrom.value; const to_id = selTo.value; const points = window._recPoints || [];
          const r = await fetch('/api/gps_routes/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({from_id, to_id, points, tolerance_m: tolM})});
          const j = await r.json(); if (!j.ok) { alert(j.error||'Save failed'); return; }
          await loadGpsRoutes(); const rs = document.getElementById('recording-status'); if (rs) rs.textContent = 'Saved route.'; btnSave.disabled = true;
        };
        // Removed follow route button
        // Preview saved route when selects change
        const previewSaved = async () => {
          const from_id = selFrom.value; const to_id = selTo.value;
          try {
            const r = await fetch(`/api/gps_routes/local?from_id=${encodeURIComponent(from_id)}&to_id=${encodeURIComponent(to_id)}`);
            const j = await r.json(); if (j && j.ok && Array.isArray(j.points)) { window._previewLocal = j.points; redrawCanvas(); }
          } catch {}
        };
        selFrom.addEventListener('change', previewSaved);
        selTo.addEventListener('change', previewSaved);
      })();
    </script>
