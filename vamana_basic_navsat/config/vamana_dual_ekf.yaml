navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: true # new param name
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: false
