# Dual EKF + NavSat parameters (mirrors your working pattern)
# - ekf_filter_node_odom: publishes odom -> base_footprint  (local)
# - ekf_filter_node_map : publishes map  -> odom            (global, GPS-aligned)

ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    print_diagnostics: true
    debug: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odom: TWIST ONLY (pose/orientation false)
    odom0: /diff_drive_base_controller/odom
    odom0_config:
      [
        true,
        true,
        false,
        false,
        false,
        false,
        true,
        true,
        true,
        false,
        false,
        true,
        false,
        false,
        false,
      ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: yaw orientation only
    imu0: imu
    imu0_config:
      [
        false,
        false,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
        false,
      ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false

