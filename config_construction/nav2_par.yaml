controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    # controller_plugins: ["RotateShim","FollowPath"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 5.0

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # rotate_to_goal_heading: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.5 #updated to check if the speed increases
      max_vel_y: 0.0
      max_vel_theta: 2.5
      min_vel_theta: -2.5
      min_speed_xy: 0.05
      max_speed_xy: 1.5
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 3.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist","RotateToGoal"]
      BaseObstacle.scale: 0.3
      PathAlign.scale: 32.0    #24.0
      PathAlign.forward_point_distance: 0.15   #0.1
      GoalAlign.scale: 28.0         #32.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 24.0    #32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 30.0   #30.0
      RotateToGoal.slowing_factor: 7.0   #5.0
      RotateToGoal.lookahead_time: -1.0


# GPS WPF CHANGE: Remove static layer
# GPS WPF CHANGE: Remove static layer
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      # robot_radius: 1.0
      footprint: "[ [0.98, 0.6], [0.98, -0.6], [-0.98, -0.6], [-0.98, 0.6] ]"

      # plugins: ["voxel_layer","denoise_layer","inflation_layer"]
      plugins: ["voxel_layer","stvl_layer","denoise_layer","inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.2
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 1.3
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan #pointcloud_sensor
        scan:
          topic: /scan 
          max_obstacle_height: 2.0
          clearing: True
          marking: False
          observation_persistence: 1.0 
          data_type: "LaserScan"
          raytrace_max_range: 22.0  
          raytrace_min_range: 1.50 #0.5
          obstacle_max_range: 22.0
          obstacle_min_range: 1.50 #0.5
          inf_is_valid: true
          expected_update_rate: 0.2
          
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 7.0
        decay_model: 0
        voxel_size: 0.07
        track_unknown_space: true
        unknown_threshold: 6
        mark_threshold: 6
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 1.3
        publish_voxel_map: true
        expected_update_rate: 0.5
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 0.0   
        observation_sources: rgbd1_mark rgbd1_clear
        rgbd1_mark:
          data_type: PointCloud2
          topic: /zed/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: true
          obstacle_range: 15.0          # metersf
          min_obstacle_height: 0.7   # default 0, meters
          max_obstacle_height: 2.0     # default 3, meters
          expected_update_rate: 0.5    # default 5.0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: true          # default false, for laser scans
          filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on 
          voxel_min_points: 3          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
          vertical_fov_angle:  1.39626 # default 0.7, radians
          horizontal_fov_angle:  1.9199 # default 1.04, radians
        rgbd1_clear:
          data_type: PointCloud2
          topic: /zed/zed_node/point_cloud/cloud_registered
          marking: true
          clearing: true
          max_z: 3.0                  # default 0, meters
          min_z: 0.3              # default 10, meters
          vertical_fov_angle:  1.39626 # default 0.7, radians
          horizontal_fov_angle:  1.9199 # default 1.04, radians
          decay_acceleration: 1.0     # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0     
          expected_update_rate: 0.5
          observation_persistence: 1.5     

# GPS WPF CHANGE: Set rolling global costmap with 50x50 size. See note below
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      use_sim_time: False
      robot_base_frame: base_footprint
      # robot_radius: 1.0
      footprint: "[ [0.98, 0.5], [0.98, -0.5], [-0.98, -0.5], [-0.98, 0.5] ]"
      resolution: 0.1
      
      rolling_window: true
      width: 100
      height: 100
      track_unknown_space: true
      # no static map
      #plugins: ["voxel_layer","stvl_layer","inflation_layfalseer" ]
      plugins: ["voxel_layer","inflation_layer" ]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        mark_threshold: 3
        publish_voxel_map: True
        origin_z: 1.3
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: scan rgbd1_mark rgbd1_clear
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          observation_persistence: 0.0 
          raytrace_max_range: 22.0
          raytrace_min_range: 1.50 #0.50
          obstacle_max_range: 22.0
          obstacle_min_range: 1.50 #0.50
          inf_is_valid: true
        rgbd1_mark:
          data_type: PointCloud2
          topic: /zed/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          obstacle_range: 15.0          # meters
          min_obstacle_height: 0.7  # default 0, meters
          max_obstacle_height: 2.0     # default 3, meters
          expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false          # default false, for laser scans
          filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on 
          voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
          vertical_fov_angle:  1.39626 # default 0.7, radians
          horizontal_fov_angle:  1.9199 # default 1.04, radians
        rgbd1_clear:
          data_type: PointCloud2
          topic: /zed/zed_node/point_cloud/cloud_registered
          marking: false
          clearing: true
          max_z: 3.0                  # default 0, meters
          min_z: 0.3                  # default 10, meters
          vertical_fov_angle: 1.39626 # default 0.7, radians
          observation_persistence: 0.0
          horizontal_fov_angle:  1.9199 # default 1.04, radians
          decay_acceleration: 1.0     # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0                # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
          observation_persistence: 1.5
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.2
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.4 #0.6
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    # simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 30
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    action_server_result_timeout: 3000.0
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [1.5, 0.0, 2.5] #original values 1.5, 0.0, 3.0 
    min_velocity: [0.0, 0.0, -3.0] #original values 0.0, 0.0, -3.0 
    max_accel: [7.0, 0.0, 4.0] #orginal values 4.0, 0.0, 4.5
    max_decel: [-7.0, 0.0, -5.0] #original values -4.0, 0.0, -4.5
    odom_topic: "/odometry/local"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.00, 0.00]
    velocity_timeout: 0.8