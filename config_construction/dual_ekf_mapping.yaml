navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 20.0
    delay: 2.0
    magnetic_declination_radians: -0.0279253
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: false

